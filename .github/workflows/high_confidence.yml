name: High-confidence watch

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip real LINE pushes (log only)"
        type: boolean
        default: true
      test_message:
        description: "If set, sends this as a one-off LINE test push and skips the normal watch run"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: atashinchi-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Send test LINE push
        if: github.event_name == 'workflow_dispatch' && inputs.test_message != ''
        env:
          LINE_CHANNEL_ID: ${{ secrets.LINE_CHANNEL_ID }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python -m scripts.send_test_notification "${{ inputs.test_message }}"

      - name: Run high-confidence watch
        if: github.event_name != 'workflow_dispatch' || inputs.test_message == ''
        env:
          LINE_CHANNEL_ID: ${{ secrets.LINE_CHANNEL_ID }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: python -m scripts.run_high_confidence

      - name: Commit and push state/site updates
        if: github.event_name != 'workflow_dispatch' || inputs.test_message == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ docs/
          git diff --cached --quiet || git commit -m "chore: high-confidence update"
          git pull --rebase
          git push
